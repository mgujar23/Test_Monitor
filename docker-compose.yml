version: '3.8'

services:
  test-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-monitor-dashboard
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Set to "true" to enable demo mode (mock data)
      # DEMO_MODE: "false"
    volumes:
      # Mount configuration directory for easy config updates
      - ./config.json:/app/config.json:ro
      # Mount fixes.json for persistent manual fixes
      - ./fixes.json:/app/fixes.json
      # Mount cache directory for persistent data
      - ./cache:/app/cache
      # Mount logs directory for persistent logging
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - test-monitor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  test-monitor-network:
    driver: bridge
